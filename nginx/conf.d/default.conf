server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name docste.kz www.docste.kz;

    # ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    # ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    ssl_certificate /etc/letsencrypt/live/docste.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docste.kz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://back:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Backend Admin (sqladmin)
    # Normalize /admin -> /admin/
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        proxy_pass http://back:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Заменяем http:// на https:// в HTML ответах от админки
        sub_filter 'http://$host' 'https://$host';
        sub_filter 'http://194.32.142.92' 'https://194.32.142.92';
        sub_filter_types text/html text/css text/javascript application/javascript application/json;
        sub_filter_once off;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
}
